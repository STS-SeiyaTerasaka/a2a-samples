[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_a2a_agents_pkg"
version = "0.1.0"
description = "A package for various ADK and CrewAI agents for A2A deployment"
dependencies = [
    "google-adk==1.14.1",
    "crewai==0.35.0",
    "Pillow>=10.3.0",
    "python-dotenv==1.0.1",
    "google-generativeai==0.8.0",
    "google-cloud-aiplatform>=1.70.0"
]

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
